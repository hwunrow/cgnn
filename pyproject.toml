[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgnn"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "epiweeks>=2.4.0",
    "geopandas>=1.1.3",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "pandas>=3.0.2",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torch-cluster>=1.6.3",
    "torch-geometric>=2.7.0",
    "torch-geometric-temporal>=0.56.2",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "torch-spline-conv>=1.2.2",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.extra-build-dependencies]
torch-cluster = ["torch"]
torch-scatter = ["torch"]
torch-sparse = ["torch"]
torch-spline-conv = ["torch"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.10.1",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.7",
    "mizani>=0.14.4",
    "plotly>=6.7.0",
    "plotnine>=0.15.3",
    "statsmodels>=0.14.6",
]
