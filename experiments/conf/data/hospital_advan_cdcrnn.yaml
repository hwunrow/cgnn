version: "hospital_advan_cdcrnn"
# CDCRNN experiments: same dates across all 6 (do not change originals)
start_date: "07/13/2020"
end_date: "12/31/2022"
train_ratio: 0.8
train_split_idx: 10

time_window_size: 7
temporal_edge_window_size: 1
mobility_cutoff: 1000

raw_death_url: "https://raw.githubusercontent.com/CSSEGISandData/COVID-19/refs/heads/master/csse_covid_19_data/csse_covid_19_time_series/time_series_covid19_deaths_US.csv"
raw_case_url: "https://raw.githubusercontent.com/CSSEGISandData/COVID-19/refs/heads/master/csse_covid_19_data/csse_covid_19_time_series/time_series_covid19_confirmed_US.csv"
raw_safegraph_file: "/burg/apam/users/nhw2114/repos/cgnn/data/raw/mobility/safegraph/all_harddrive_us.csv"
raw_mobility_report_dir: "/burg/apam/users/nhw2114/repos/cgnn/data/raw/google_mobility_reports/"
pop_url: "https://www2.census.gov/programs-surveys/popest/datasets/2020-2023/counties/totals/co-est2023-alldata.csv"
raw_hospitalization_file: "/burg/apam/users/nhw2114/repos/cgnn/data/raw/COVID-19_Reported_Patient_Impact_and_Hospital_Capacity_by_Facility_20251026.csv"
raw_advan_file: "/burg/apam/users/nhw2114/repos/cgnn/data/raw/mobility/advan/all_advan_fix.csv"

hosp_col: "total_adult_patients_hospitalized_confirmed_covid_7_day_sum"
max_missing_weeks: 21

data_source: "hospital"
mobility_source: "advan"
# feature_cols omitted: loader uses [hosp_col] for hospital data
