# Hydra Configuration Template
# This template is kept in nb/config.yaml
# Copies are saved to data/processed/{version}/config.yaml and models/gcn_checkpoints/{version}/config.yaml

defaults:
  - _self_
  - data: hospital_advan
  - model: gcn_hospital

training:
  # Optimizer parameters
  optimizer: "adam"
  learning_rate: 1e-5
  weight_decay: 5e-4
  # Training parameters
  num_epochs: 5000
  loss_function: "rmsle" 
explain:
  # GNNExplainer
  epochs: 200
  prev_weeks: 4
  explain_dates:

  # Explainer configuration
  explanation_type: "model"
  node_mask_type: "attributes"
  edge_mask_type: "object"
  
  # Model config for explainer
  model_config:
    mode: "regression"
    task_level: "node"
    return_type: "raw"
  
  # Other parameters
  verbose: false
  edge_mask_threshold: 0.5  # Threshold for filtering edges in explanation
