# Hydra Configuration Template
# This template is kept in nb/config.yaml
# Copies are saved to data/processed/{version}/config.yaml and models/gcn_checkpoints/{version}/config.yaml

defaults:
  - _self_
  - data: cdcrnn/hospital_advan_plus_full_cdcrnn
  - model: cdcrnn_hospital_hs16

version: ???

training:
  # Optimizer parameters
  optimizer: "adam"
  learning_rate: 1e-5
  weight_decay: 5e-4
  # Training parameters
  num_epochs: 5000
  loss_function: "rmsle"
explain:
  epochs: 200
  edge_mask_threshold: 0.5
  lr: 0.01
